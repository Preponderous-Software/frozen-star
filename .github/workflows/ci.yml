# Tests, a headless smoke test, and (on main, when enabled) the deploy to arcade:
# https://frozen-star.play.danielstephenson.dev
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Unit tests
        run: npm test

      - name: Assemble the site
        run: |
          mkdir -p site
          cp -r index.html styles.css game.css src vendor assets site/
          version=$(node -p "require('./package.json').version")
          echo "${version}+g${GITHUB_SHA::7}" > site/version.txt
          cat site/version.txt
          echo "site: $(du -sh site | cut -f1), $(find site -type f | wc -l) files"

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.61.1
          npx playwright install --with-deps chromium

      - name: Smoke test
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 --directory site > http.log 2>&1 &
          sleep 1
          node tools/smoke.cjs http://127.0.0.1:8080/index.html smoke-out

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke
          path: smoke-out/
          if-no-files-found: ignore

      - name: Deploy to arcade
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.ARCADE_ENABLED == 'true')
        uses: Stephenson-Software/arcade-deploy@v1
        with:
          slug: frozen-star
          token: ${{ secrets.ARCADE_TOKEN }}
          site-dir: site
          version-file: site/version.txt
          skip-existing: "true"
